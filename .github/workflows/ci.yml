name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workspace
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: workspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace -d workspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://workspace:workspace@localhost:5432/workspace
      REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql+asyncpg://workspace:workspace@localhost:5432/workspace
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - name: Install backend
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --no-sync ruff check app tests alembic
      - name: Migration
        run: uv run --no-sync alembic upgrade head
      - name: Test
        run: uv run --no-sync pytest -q
      - name: Model and migration consistency
        run: uv run --no-sync alembic check
      - name: End-to-end smoke
        run: |
          set -e
          uv run --no-sync uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/workspace-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID >/dev/null 2>&1 || true; cat /tmp/workspace-api.log' EXIT
          uv run --no-sync python scripts/smoke_research.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: npm run test:e2e

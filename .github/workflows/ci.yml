name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workspace
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: workspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace -d workspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://workspace:workspace@localhost:5432/workspace
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests alembic
      - name: Test
        run: pytest -q
      - name: Migration
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
